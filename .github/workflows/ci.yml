name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned by commit (the tag it was released as follows each one).
jobs:
  unit:
    name: shellcheck, node --check, bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install shellcheck and bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install shellcheck bats-core
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck bats
          fi
      - name: shellcheck
        run: git ls-files '*.sh' '*.bash' | xargs shellcheck -x
      - name: node --check
        run: git ls-files '*.cjs' | xargs -n 1 node --check
      - name: bats
        run: bats --print-output-on-failure tests/bats
      - name: Executor and DNS protocol tests
        run: python3 -m unittest discover -s tests/python -v

  linux-integration:
    name: Linux client in a container (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create a non-root user with passwordless sudo
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD:ALL\n' >/etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          home=$(getent passwd builder | cut -d: -f6)
          cp -R "$GITHUB_WORKSPACE" "$home/orca-setup"
          chown -R builder:builder "$home/orca-setup"
      - name: --apply --role client twice, then --check
        shell: bash
        run: |
          home=$(getent passwd builder | cut -d: -f6)
          sudo -u builder env -i CI=true HOME="$home" USER=builder LOGNAME=builder SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash "$home/orca-setup/tests/integration/linux.sh" client

  linux-server:
    name: Linux server in Docker on the runner VM (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      # The image built from this commit, served by a local registry so setup.sh pulls and locks it like the
      # published one (DESIGN.md section 6.7); never pushed anywhere else.
      ORCA_SETUP_IMAGE: localhost:5000/orca-server:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start a local registry
        run: docker run --detach --name registry --publish 127.0.0.1:5000:5000 registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
      - name: Build the Orca server image
        run: |
          docker build --file docker/Dockerfile --tag "$ORCA_SETUP_IMAGE" .
          docker push "$ORCA_SETUP_IMAGE"
      - name: --apply --role server twice, then --check
        shell: bash
        # A clean environment: no GitHub token, no preinstalled tool directories beyond the system PATH. The runner's
        # own Docker is used as it is.
        run: |
          env -i CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" HOME="$HOME" USER="$USER" \
            LOGNAME="$USER" SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ORCA_SETUP_IMAGE="$ORCA_SETUP_IMAGE" bash tests/integration/linux.sh server
      - name: Isolated gateways and LAN-only execution (real packets)
        shell: bash
        run: bash tests/integration/network.sh

      - name: Process management and maintenance pairing recovery
        timeout-minutes: 10
        shell: bash
        # Exercise this commit's freshly built image without host accounts or runner credentials.
        run: |
          env -i CI=true HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ORCA_SETUP_TEST_IMAGE="$ORCA_SETUP_IMAGE" python3 tests/integration/tui-management.py
      - name: Native Orca process restart without container restart
        timeout-minutes: 10
        shell: bash
        # Exercise this commit's freshly built image without host accounts or runner credentials.
        run: |
          env -i CI=true HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ORCA_SETUP_TEST_IMAGE="$ORCA_SETUP_IMAGE" python3 tests/integration/service-native.py
      - name: Non-root mutual SSH and persistent interactive shells
        timeout-minutes: 5
        shell: bash
        # Exercise this commit's freshly built image without host accounts or runner credentials.
        run: |
          env -i CI=true HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ORCA_SETUP_TEST_IMAGE="$ORCA_SETUP_IMAGE" python3 tests/integration/internal-ssh.py

  publish:
    name: Publish ghcr.io/vzxxbacq/orca-server
    # Only pushes to main publish; a pull request never reaches this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, linux-integration, linux-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vzxxbacq/orca-server:main
            ghcr.io/vzxxbacq/orca-server:sha-${{ github.sha }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vzxxbacq/orca-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories (and need artifact-metadata: write).
          create-storage-record: false
