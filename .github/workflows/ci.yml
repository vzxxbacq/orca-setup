name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: shellcheck, node --check, bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install shellcheck and bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install shellcheck bats-core
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck bats
          fi
      - name: shellcheck
        run: git ls-files '*.sh' '*.bash' | xargs shellcheck -x
      - name: node --check
        run: git ls-files '*.cjs' | xargs -n 1 node --check
      - name: bats
        run: bats tests/bats

  linux-integration:
    name: Linux integration (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Create a non-root user with passwordless sudo
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD:ALL\n' >/etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          home=$(getent passwd builder | cut -d: -f6)
          cp -R "$GITHUB_WORKSPACE" "$home/orca-setup"
          chown -R builder:builder "$home/orca-setup"
      - name: --apply --role server twice, then --check
        shell: bash
        run: |
          home=$(getent passwd builder | cut -d: -f6)
          sudo -u builder env -i CI=true HOME="$home" USER=builder LOGNAME=builder SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash "$home/orca-setup/tests/docker/integration.sh"
