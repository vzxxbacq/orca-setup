# orca-setup: Orca server container for this user
# Rendered by `./setup.sh --apply --role server` from docker/compose.yaml (DESIGN.md section 6.7) into
# ~/.config/orca-setup/docker/compose.yaml; rerun it to change this file instead of editing it. The first line marks
# the file as orca-setup's, and x-orca-setup records the options it was rendered with.
# --no-pairing: normal service never creates an offer. Pair a client using
# interactive maintenance pairing in the TUI instead (DESIGN.md section 3.3.2).
name: @PROJECT@
x-orca-setup:
  workdir: "@WORKDIR@"
  pairing-address: "@PAIRING_ADDRESS@"
  publish-address: "@PUBLISH_ADDRESS@"
  network-mode: "@NETWORK_MODE@"
  network-policy: "@POLICY_SUM@"
  process-manager: "@PROCESS_MANAGER@"
  config-file: "@CONFIG_FILE@"
services:
  orca-server:
    image: "@IMAGE@"
    # The image is pulled and locked by setup.sh (image.lock); Compose never pulls or upgrades it.
    pull_policy: never
    container_name: @SERVER_NAME@
    command: ["python3", "/opt/orca-service.py", "run", "bash", "-c", ". /opt/orca-setup/lib/detect.sh; cli=$$(detect_orca_cli); exec \"$$cli\" \"$$@\"", "orca-service", "serve", "--supervise", "--no-pairing", "--port", "@PORT@", "--pairing-address", "@PAIRING_ADDRESS@"]
    # The compose project's own bridge network. Port 6768 is published on one host address only, the private
    # publish address (--publish-address): the host's other addresses (a public one included) do not answer on it.
    # Nothing else is published.
@SERVER_NETWORK@
    # The host's name instead of the container's id: Orca shows it to clients and records it in its profile locks.
@SERVER_HOSTNAME@
    # Docker starts it again after a reboot, unless it was stopped on purpose (docker compose stop).
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    # Your UID:GID, so every file in the mounts stays yours. No sudo and no Docker inside.
    user: "@UID@:@GID@"
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      ORCA_INTERNAL_SSH: "@INTERNAL_SSH@"
      HOME: "@HOME@"
      USER: "@USER@"
      LOGNAME: "@USER@"
      PATH: "@HOME@/.local/bin:/opt/orca-agents/.local/bin:/opt/orca-agents/.grok/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      # Claude Code keeps its state file in $CLAUDE_CONFIG_DIR/.claude.json instead of ~/.claude.json: a file of its
      # own could not be bind-mounted, because Claude replaces it by renaming a new copy over it.
      CLAUDE_CONFIG_DIR: "@HOME@/.claude"
@SERVER_ENVIRONMENT@
    labels:
      org.orca-setup.config: "@CONFIG@"
    # Bound normal-service logs locally. Maintenance pairing output uses a private socket to the terminal
    # and never enters this log driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
@LIMITS@
    # The selected host or dedicated home and any additional directories are bind-mounted at their container paths.
    # A missing host directory is an error, never created by Docker as root.
    volumes:
@VOLUMES@
@NETWORK_SERVICES@
